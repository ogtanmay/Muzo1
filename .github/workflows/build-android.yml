name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Keystore on first run
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & Bundle
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleRelease --stacktrace || true

      - name: Upload APKs (Debug & Release)
        uses: actions/upload-artifact@v4
        with:
          name: muzo-apks
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: muzo-release-bundle
          path: |
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 30
